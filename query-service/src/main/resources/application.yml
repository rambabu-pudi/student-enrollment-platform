server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024

spring:
  application:
    name: query-service
  datasource:
    # Points at a read replica in production; the read path never writes.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enrollment}
    username: ${DB_USERNAME:enrollment}
    password: ${DB_PASSWORD:enrollment}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      read-only: true
      pool-name: enrollment-read-pool
  # Flyway is owned exclusively by processing-service; the read service must not migrate.
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: query-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.example.enrollment: INFO
