server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: processing-service
  lifecycle:
    timeout-per-shutdown-phase: 60s
  datasource:
    # reWriteBatchedInserts collapses JDBC batches into multi-row INSERTs (3-5x faster upserts).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enrollment?reWriteBatchedInserts=true}
    username: ${DB_USERNAME:enrollment}
    password: ${DB_PASSWORD:enrollment}
    hikari:
      # Sized to consumer concurrency + headroom; more connections than workers only adds
      # contention inside Postgres.
      maximum-pool-size: ${DB_POOL_SIZE:12}
      minimum-idle: 4
      connection-timeout: 10000
      max-lifetime: 1800000
      pool-name: enrollment-write-pool
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:enrollment-processing}

enrollment:
  processing:
    # One DB round trip per poll: the single biggest throughput lever.
    max-poll-records: ${PROCESSING_MAX_POLL_RECORDS:2000}
    # Must not exceed the topic partition count.
    concurrency: ${PROCESSING_CONCURRENCY:8}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: processing-service

logging:
  level:
    root: INFO
    com.example.enrollment: INFO
